# CHEENA OS Phase 1b: storage proof of concept on loop devices.
# Runs tests/storage-poc/run.sh on a throwaway runner. Only image files under
# /tmp are formatted; no real disk is touched. No third-party actions are used.
name: storage-poc

on:
  push:
    branches: ["phase1b/**"]
    paths:
      - "tests/storage-poc/**"
      - ".github/workflows/storage-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: storage-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch source (public repo, plain git)
        env:
          REF: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          git init -q src && cd src
          git remote add origin "https://github.com/${REPO}.git"
          git fetch -q --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cryptsetup-bin btrfs-progs

      - name: Probe
        run: |
          uname -a
          free -g | head -2
          df -h /tmp | tail -1
          sudo modprobe dm-crypt && echo "dm-crypt: ok"
          sudo modprobe btrfs && echo "btrfs: ok"
          sudo modprobe loop && echo "loop: ok"

      - name: Run storage proof of concept
        run: sudo --preserve-env=GITHUB_STEP_SUMMARY bash src/tests/storage-poc/run.sh

      - name: Show log tail on failure
        if: failure()
        run: sudo tail -n 80 /tmp/cheena-storage-poc/poc.log || true

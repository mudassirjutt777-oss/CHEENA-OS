# CHEENA OS Phase 1a: build a minimal live ISO and boot-test it in QEMU.
#
# Runs on pushes to phase1a/** branches (workflow_dispatch only works once the
# workflow exists on the default branch), and manually.
# The ISO is NOT uploaded: GitHub Free artifact storage is 500 MB.
# Only small evidence files are kept. See docs/operations/build-environment.md §2a.
name: image-build

on:
  push:
    branches: ["phase1a/**"]
    paths:
      - "build/**"
      - ".github/workflows/image-build.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # explicit shell => bash -eo pipefail, so failures inside "| tee" are not hidden

concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Probe runner (before cleanup)
        run: bash build/scripts/probe-runner.sh before-cleanup | tee probe-before.txt

      - name: Reclaim disk space (remove preinstalled toolchains not needed here)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Probe runner (after cleanup)
        run: bash build/scripts/probe-runner.sh after-cleanup | tee probe-after.txt

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap squashfs-tools xorriso mtools grub-pc-bin grub-efi-amd64-bin \
            qemu-system-x86 ovmf socat netpbm ubuntu-keyring

      - name: Choose work directory with most free space
        id: workdir
        run: |
          best=/
          if [ -d /mnt ] && [ "$(df --output=avail /mnt | tail -1)" -gt "$(df --output=avail / | tail -1)" ]; then best=/mnt; fi
          dir="${best%/}/cheena-build"
          sudo mkdir -p "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "Work dir: $dir"

      - name: Build ISO
        run: |
          mkdir -p evidence
          sudo CHEENA_CI_BUILD=1 CHEENA_GIT_COMMIT="$GITHUB_SHA" bash build/scripts/build-iso.sh \
            "${{ steps.workdir.outputs.dir }}/work" "${{ steps.workdir.outputs.dir }}/out" 2>&1 \
            | tee evidence/build.log

      - name: Collect build outputs
        if: always()
        run: |
          out="${{ steps.workdir.outputs.dir }}/out"
          for f in SHA256SUMS build-info.json package-manifest.tsv; do
            sudo cp "$out/$f" evidence/ 2>/dev/null || echo "missing: $f"
          done
          sudo chown -R "$(id -u):$(id -g)" evidence
          cp probe-before.txt probe-after.txt evidence/
          df -h / /mnt > evidence/disk-after-build.txt

      - name: Boot test (QEMU, UEFI, Secure Boot off)
        run: |
          iso="$(ls "${{ steps.workdir.outputs.dir }}"/out/*.iso)"
          bash build/scripts/boot-test.sh "$iso" evidence

      - name: Generate SBOM from the image root filesystem
        if: success()
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: ${{ steps.workdir.outputs.dir }}/work/rootfs
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false

      # Job logs and artifacts need a GitHub login even on public repos.
      # Check-run annotations don't, so key results are also published there.
      - name: Publish results as annotations (readable without login)
        if: always()
        run: |
          enc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g'; }
          if [ -s evidence/boot-result.json ]; then
            echo "::notice title=boot-result.json::$(enc < evidence/boot-result.json)"
          fi
          if [ -s evidence/build-info.json ]; then
            echo "::notice title=build-info.json::$(enc < evidence/build-info.json)"
          fi
          if [ -s evidence/probe-after.txt ]; then
            echo "::notice title=runner probe (after cleanup)::$(enc < evidence/probe-after.txt)"
          fi
          if [ "${{ job.status }}" != "success" ]; then
            for f in evidence/build.log evidence/serial.log; do
              [ -s "$f" ] || continue
              echo "::error title=Last 60 lines of $(basename "$f")::$(tail -n 60 "$f" | enc)"
            done
          fi

      - name: Upload evidence (no ISO)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1a-evidence-${{ github.run_number }}
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
